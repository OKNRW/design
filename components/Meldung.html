<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meldung – OKNRW Designsystem</title>
<link rel="stylesheet" href="../dist/oknrw.css">
<style>body{background:var(--ok-bg-base)}</style>
</head>
<body>
<div class="ok-stage ok-stage--col">
 <div class="ok-alert" role="status"><svg aria-hidden="true" focusable="false" class="ok-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <circle cx="12" cy="12" r="10" /> <path d="M12 16v-4" /> <path d="M12 8h.01" /> </svg><div><span class="ok-alert__title">Anmeldung ab 1. Oktober</span><p>Die Teilnahme ist kostenfrei. Plätze werden in der Reihenfolge der Anmeldung vergeben.</p></div></div>
 <div class="ok-alert ok-alert--success" role="status"><svg aria-hidden="true" focusable="false" class="ok-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <circle cx="12" cy="12" r="10" /> <path d="m9 12 2 2 4-4" /> </svg><div><span class="ok-alert__title">Anmeldung eingegangen</span><p>Du erhältst eine Bestätigung per E-Mail.</p></div></div>
 <div class="ok-alert ok-alert--error" role="alert"><svg aria-hidden="true" focusable="false" class="ok-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" /> <path d="M12 9v4" /> <path d="M12 17h.01" /> </svg><div><span class="ok-alert__title">Anmeldung nicht gesendet</span><p>Zwei Felder sind unvollständig. Bitte prüfe die markierten Angaben.</p></div></div>
</div>
<script src="../js/oknrw.js"></script>
</body>
</html>
