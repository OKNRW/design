<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Newsletter – OKNRW Designsystem</title>
<link rel="stylesheet" href="../dist/oknrw.css">
<style>body{background:var(--ok-bg-base)}</style>
</head>
<body>
<section class="ok-section" style="padding:48px 32px"><div class="ok-section__inner ok-split">
 <div><h2 class="ok-h2">Newsletter</h2><p class="ok-lead" style="margin-top:12px">Neuigkeiten zu offenen Daten und Beteiligung in NRW, etwa einmal im Monat.</p></div>
 <form class="ok-form-inline" onsubmit="return false"><div class="ok-field"><label class="ok-label" for="nl">E-Mail-Adresse</label><input class="ok-input" id="nl" type="email" placeholder="name@beispiel.de" autocomplete="email"></div>
  <button class="ok-btn ok-btn--primary" type="submit">Abonnieren</button>
  <p class="ok-small" style="flex-basis:100%;margin:0">Abmeldung jederzeit möglich. Hinweise in der <a class="ok-link" href="#">Datenschutzerklärung</a>.</p></form></div></section>
<script src="../js/oknrw.js"></script>
</body>
</html>
